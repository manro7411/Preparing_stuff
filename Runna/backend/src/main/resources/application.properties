quarkus.application.name=runcoach
quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=runcoach
quarkus.datasource.password=runcoach123
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5433/runcoach
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/*
quarkus.http.auth.permission.api.policy=authenticated
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.com/realms/runcoach}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:https://identity.example.com/realms/runcoach/protocol/openid-connect/certs}
quarkus.smallrye-openapi.info-title=RunCoach API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.swagger-ui.always-include=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.exposed-headers=ETag,Location
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=200ms
quarkus.redis.devservices.enabled=false
quarkus.redis.health.enabled=false
runcoach.cache.enabled=${CACHE_ENABLED:false}
quarkus.rest-client.openai.url=https://api.openai.com/v1
quarkus.rest-client.openai.connect-timeout=2000
quarkus.rest-client.openai.read-timeout=10000
runcoach.ai.enabled=false
runcoach.ai.api-key=${OPENAI_API_KEY:}
runcoach.ai.model=${OPENAI_MODEL:}
runcoach.billing.policy=${BILLING_POLICY:UNCONFIGURED}
runcoach.billing.prices.pro.monthly.usd=${RUNCOACH_BILLING_PRICES_PRO_MONTHLY_USD:0}
runcoach.billing.prices.pro.yearly.usd=${RUNCOACH_BILLING_PRICES_PRO_YEARLY_USD:0}
runcoach.billing.prices.elite.monthly.usd=${RUNCOACH_BILLING_PRICES_ELITE_MONTHLY_USD:0}
runcoach.billing.prices.elite.yearly.usd=${RUNCOACH_BILLING_PRICES_ELITE_YEARLY_USD:0}
runcoach.billing.prices.pro.monthly.thb=${RUNCOACH_BILLING_PRICES_PRO_MONTHLY_THB:0}
runcoach.billing.prices.pro.yearly.thb=${RUNCOACH_BILLING_PRICES_PRO_YEARLY_THB:0}
runcoach.billing.prices.elite.monthly.thb=${RUNCOACH_BILLING_PRICES_ELITE_MONTHLY_THB:0}
runcoach.billing.prices.elite.yearly.thb=${RUNCOACH_BILLING_PRICES_ELITE_YEARLY_THB:0}
%test.quarkus.scheduler.enabled=false