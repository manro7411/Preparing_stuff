apiVersion: apps/v1
kind: Deployment
metadata:
  name: runcoach-web
  namespace: runcoach
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runcoach-web
  template:
    metadata:
      labels:
        app: runcoach-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: runcoach/web:0.1.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runcoach-web
  namespace: runcoach
spec:
  selector:
    app: runcoach-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP