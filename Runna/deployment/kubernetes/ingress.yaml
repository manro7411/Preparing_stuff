apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runcoach
  namespace: runcoach
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['runcoach.example.com']
      secretName: runcoach-tls
  rules:
    - host: runcoach.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runcoach-web
                port:
                  name: http