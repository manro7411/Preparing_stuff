apiVersion: v1
kind: ConfigMap
metadata:
  name: runcoach-config
  namespace: runcoach
data:
  DB_URL: jdbc:postgresql://postgres.example.internal:5432/runcoach
  DB_USERNAME: runcoach
  CACHE_ENABLED: 'false'
  REDIS_URL: redis://redis.example.internal:6379
  JWT_ISSUER: https://identity.example.com/realms/runcoach
  JWT_PUBLIC_KEY_LOCATION: https://identity.example.com/realms/runcoach/protocol/openid-connect/certs